# Run the published image:  docker compose up -d   (then open http://localhost:8080)
# Build from source instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
name: blackmagic-cam-remote   # fixed project name: same volume wherever this file lives
services:
  blackmagic-cam-remote:
    image: ghcr.io/skeplys83/blackmagic-cam-remote:${BCR_VERSION:-latest}
    container_name: blackmagic-cam-remote
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # dashboard; reachable from this computer only
    volumes:
      - bcr-data:/data          # adb pairing keys, settings, thumbnails
    environment:
      # Set if the phone's Wi-Fi IP can't be found automatically:
      # BCR_PHONE: "192.168.1.20"
      BCR_PHONE: ${BCR_PHONE:-}
      BCR_COMPUTER_NAME: ${BCR_COMPUTER_NAME:-docker}   # shown on the phone as blackmagic-cam-remote@<this>
      BCR_DOCKER_LOCAL: "1"     # published on 127.0.0.1 only (see "ports"), so no password is needed

    # For a home server on your network, use compose.server.yaml instead.

volumes:
  bcr-data:
