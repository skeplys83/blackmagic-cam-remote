services:
  blackmagic-cam-remote:
    build: .
    image: blackmagic-cam-remote
    container_name: blackmagic-cam-remote
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # dashboard; reachable from this computer only
    volumes:
      - bcr-data:/data          # adb pairing keys, settings, thumbnails
    environment:
      # Set if the phone's Wi-Fi IP can't be found automatically:
      # BCR_PHONE: "192.168.1.20"
      BCR_PHONE: ${BCR_PHONE:-}
      BCR_DOCKER_LOCAL: "1"     # published on 127.0.0.1 only (see "ports"), so no password is needed

    # For a home server on your network, use compose.server.yaml instead.

volumes:
  bcr-data:
